spring:
  application:
    name: bet-store-reader
  cassandra:
    # The keyspace and tables are provisioned by infra (cql/bet_store.cql in tests)
    keyspace-name: bet_store
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # Lists the components (cassandra) without their details
      show-components: always
  metrics:
    distribution:
      percentiles:
        # p50/p95/p99 per endpoint (tag "uri") of http.server.requests
        "[http.server.requests]": 0.5,0.95,0.99

bet-store:
  reader:
    # Maximum number of bets returned by an account query
    bet-limit: 70
    # Maximum number of distinct ids accepted in ?betIds=
    max-bet-ids: 70
