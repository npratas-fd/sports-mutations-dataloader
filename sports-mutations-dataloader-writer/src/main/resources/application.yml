spring:
  application:
    name: sports-mutations-dataloader-writer
  cassandra:
    # The keyspace and tables are provisioned by infra (cql/sports_mutations_dataloader.cql in tests)
    keyspace-name: sports_mutations_dataloader
    request:
      # As FCQ (and so that the reader's LOCAL_QUORUM reads see every acknowledged write and delete)
      consistency: local_quorum
  kafka:
    consumer:
      group-id: sports-mutations-dataloader-writer
      # First start of the consumer group: no backfill, read what is still in the topic retention
      auto-offset-reset: earliest
      # Offsets are committed by the listener container, record by record, after the Cassandra write
      enable-auto-commit: false
      # Deserializers are set in KafkaConfiguration (String keys, FBP/ABP protobuf values)
    listener:
      ack-mode: record
      # One consumer thread per container: records of a partition are processed one at a time, in order.
      # Raise it at most to the number of partitions of the topic.
      concurrency: 1

# The writer has no API: the embedded HTTP server only serves the actuator endpoints
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # Lists the components (cassandra, kafka) without their details
      show-components: always

sports-mutations-dataloader:
  consumers:
    fbp:
      enabled: true
      topic: sb_bet_processor_topic
    abp:
      enabled: true
      topic: retail_bet_processor_topic
